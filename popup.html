<!DOCTYPE html>
<html>
<head>
  <title>Course Highlighter</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: forestgreen; /* Forest green background */
      color: #fff;                   /* White text */
      min-width: 220px;
    }
    .top-bar {
      background-color: #ffe600;     /* Dandelion yellow */
      height: 32px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      font-weight: bold;
      color: #222;                   /* Optional: dark text for contrast on yellow */
      font-size: 1.1em;
      letter-spacing: 1px;
    }
    .content {
      padding: 16px 12px 12px 12px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    #status {
      margin-top: 10px;
      color: #ffe600; /* Dandelion yellow for status messages */
    }
    input[type="checkbox"] {
      accent-color: #ffe600;
    }
  </style>
</head>
<body>
  <div class="top-bar">Course Highlighter</div>
  <div class="content">
    <label for="toggle">Enable highlighting:</label>
    <input type="checkbox" id="toggle" />
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
